# ruff 配置（T1.1 · 静态检查门槛）
line-length = 110
target-version = "py312"
src = ["src", "tests", "workers", "scripts"]

[lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF",
  "ASYNC",  # 禁 async 中的阻塞调用（time.sleep 等）
  "T20",    # 禁 print（用 structlog / rich）
  "PTH",    # 强制 pathlib
  "TRY",    # 禁裸 except
  "PL",     # pylint 子集
]
ignore = [
  "PLR0913", # 参数过多：契约函数常见
  "PLR0917", # 位置参数过多：FastAPI 路由的每个形参都是一个 query / 依赖项（T4.9）
  "PLR2004", # 魔法值：阈值常量可读性优先
  "TRY003",  # 异常消息不内联：本地项目，可读性优先
  "PLR0912", # 分支过多
  "PLR0915", # 语句过多
  "RUF001", # 全角标点：中文文档字符串与注释的既定风格（非拼写错误）
  "RUF002", # 同上（docstring）
  "RUF003", # 同上（注释）
]

[lint.per-file-ignores]
"tests/**" = ["T20", "PLR2004"]
"scripts/**" = ["T20"]
"src/studio/cli.py" = ["T20"]  # CLI 面向人的输出走 rich
"src/studio/services/service_manager.py" = ["T20"]  # run_entry 是进程入口：诊断必须进 data/logs/<name>.log

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
known-first-party = ["studio"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
