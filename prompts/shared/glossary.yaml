# 读音纠正词表（T2.5 · §04.3.6 步骤 3/4）
#
# ★ 这是**数据**，不是代码：改本文件即生效 —— 不用改代码、不用重启服务
#   （`tts/text_normalize.py` 的 GlossaryStore 按 mtime 自动重载）。
#   听到"银行"念错了，改一行就够；攒着改的代价是"这一批片子全带着错音发出去了"。
#
# ★ 三条加载期校验（违反即 CONFIG_INVALID，**绝不静默放过**）：
#   1) key / value 都非空；
#   2) 同一个 key 不得同时出现在 abbreviations 与 terms（重了就成了
#      "哪张表先生效"的悬案）；
#   3) 任一 value **不得包含任何 key** —— 这是 normalize 幂等性的结构性保证。
#      反例：key `A` → value `AB` 且 key `B` → value `C`，那么 `A` 第一遍变 `AB`、
#      第二遍又变 `AC`，同一句话两次合成出两个音，句级缓存（T2.6）永远命不中。
#   `units` 不参与规则 2/3：它的 key 只在"紧跟数字"时生效（`5km`），换出来的
#   `五公里` 里没有数字，第二遍不会再被吃一次。
#
# ★ 匹配规则：**最长 key 优先**、单遍扫描（换出来的字不再参与本轮匹配）。

schema_version: "1.0"

# ── 步骤 3：英文缩写与专名 → 读法 ─────────────────────────────
# 全部用"读出来是什么"来写，不用音标：这份表的读者是写稿的人，不是语音学家。
abbreviations:
  AI: 诶哎
  API: A P I
  APP: 诶普
  AR: A R
  BGM: B G M
  CPU: C P U
  FFmpeg: F F m peg
  FPS: F P S
  GPU: G P U
  GPT: G P T
  GT: G T
  HDD: H D D
  ID: I D
  MC: M C
  MP3: M P 三
  MP4: M P 四
  NPC: N P C
  PC: P C
  PDF: P D F
  PNG: P N G
  PVP: P V P
  RAM: R A M
  SSD: S S D
  UI: U I
  USB: U S B
  UX: U X
  VR: V R

# ── 步骤 4：多音字 / 易错词 → 强制替换 ────────────────────────
# 只收"TTS 真会念错"的词。**不做同义词替换** —— 那是改稿的事（T1.11），
# 混在这里会让"归一化"悄悄改掉稿子的意思，而改稿是要留痕的。
# 每行后面的注释就是"它为什么在这"：删掉一行之前先看一眼那条理由还成不成立。
terms:
  银行: 银航        # 行 háng，易被念成 xíng
  行走: 形走        # 行 xíng，易被念成 háng
  一行: 一航
  同行: 同航
  重新: 崇新        # 重 chóng，易被念成 zhòng
  重启: 崇启
  重量: 众量        # 重 zhòng，易被念成 chóng
  重要: 众要
  长江: 长将        # 长 cháng，易被念成 zhǎng
  增长: 增掌        # 长 zhǎng
  音乐: 音月        # 乐 yuè，易被念成 lè
  快乐: 快勒        # 乐 lè
  主角: 主决        # 角 jué，易被念成 jiǎo
  角色: 决色
  的确: 迪确        # 的 dí，易被念成 de
  目的: 目地        # 的 dì
  给予: 几予        # 给 jǐ，易被念成 gěi
  潜力: 前力        # 潜 qián
  因为: 因位        # 为 wèi
  勉强: 免强        # 强 qiǎng，易被念成 qiáng
  质量: 质亮        # 量 liàng，易被念成 liáng
  提供: 提工        # 提 tí，易被念成 dī
  曲线: 屈线        # 曲 qū，易被念成 qǔ

# ── 步骤 2：单位读法（**只在紧跟数字时生效**）─────────────────
# 注意大小写：同一单位的两种写法（m / M）会撞成"哪个赢"的悬案 ⇒ 加载期直接报错。
units:
  km: 公里
  cm: 厘米
  mm: 毫米
  kg: 千克
  mg: 毫克
  ml: 毫升
  min: 分钟
  ms: 毫秒
  GB: G
  MB: M
  KB: K
  TB: T
  fps: 帧
  m: 米
  g: 克
  L: 升
  s: 秒
  h: 小时
  w: 瓦
  V: 伏
  A: 安
