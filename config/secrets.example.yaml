# ── 密钥模板（本文件入库；同目录的 secrets.yaml **绝不入库**）──────────
# 用法：Copy-Item config\secrets.example.yaml config\secrets.yaml
#
# 优先级：环境变量 > secrets.yaml
#   STUDIO_WEBUI_PASSWORD  >  webui.password
#   STUDIO_LLM_API_KEY     >  （不提供 yaml 入口，密钥只走环境变量）
#
# 说明：局域网鉴权（app.yaml: web.allow_lan=true）时**必须**有密码，
#       否则 studio config validate / doctor 直接拒绝启动（§01.2.5）。
schema_version: "1.0"

webui:
  # 仅本机（allow_lan=false）时可留空 ⇒ 免密
  password: null

# LLM 密钥（E6）。**面板上填的就是这里**：WebUI「设置」面板 → LLM 通道。
# 也可以手工填 —— 保存后**立刻生效，不需要重启任何进程**（网关每次调用现取一次）。
# 优先级：环境变量 STUDIO_LLM_API_KEY > 本文件；两边都有时以环境变量为准。
llm:
  api_key: null