# ── 输出 profile 与合成参数（§01.8.2 / §04.2.8 / T3.2）───────────────
# 一期 = 单遍合成：跑酷循环裁长 → 缩放铺满 → 固定水印 → 混音 → 一次编码。
# ★ 水印是可选装饰：有就贴、没有就跳过（缺失不阻塞出片）。
schema_version: "1.0"

default_profile: douyin_1080x1920_30fps_v1

profiles:
  douyin_1080x1920_30fps_v1:
    width: 1080
    height: 1920
    fps: 30
    vcodec: libx264
    crf: 21
    preset: medium
    pix_fmt: yuv420p
    colorspace: bt709
    faststart: true
    gop: 60
    acodec: aac
    audio_bitrate: 192k
    audio_sample_rate: 48000
    audio_channels: 2
    platforms: [douyin, kuaishou, shipinhao]

  xhs_1080x1440_30fps_v1:
    width: 1080
    height: 1440
    fps: 30
    vcodec: libx264
    crf: 21
    preset: medium
    pix_fmt: yuv420p
    colorspace: bt709
    faststart: true
    gop: 60
    acodec: aac
    audio_bitrate: 192k
    audio_sample_rate: 48000
    audio_channels: 2
    platforms: [xiaohongshu]

  bili_1920x1080_30fps_v1:
    width: 1920
    height: 1080
    fps: 30
    vcodec: libx264
    crf: 21
    preset: medium
    pix_fmt: yuv420p
    colorspace: bt709
    faststart: true
    gop: 60
    acodec: aac
    audio_bitrate: 192k
    audio_sample_rate: 48000
    audio_channels: 2
    platforms: [bilibili, xigua]

  fallback_720x1280_v1:
    width: 720
    height: 1280
    fps: 30
    vcodec: h264_nvenc
    nvenc_preset: p4
    cq: 26
    pix_fmt: yuv420p
    colorspace: bt709
    faststart: true
    gop: 60
    acodec: aac
    audio_bitrate: 128k
    audio_sample_rate: 48000
    audio_channels: 2
    platforms: []

# 水印（T3.2）：路径相对 STUDIO_HOME；文件在 ⇒ 贴，不在 ⇒ 跳过
watermark:
  path: templates/douyin_9x16_default/assets/images/watermark.png
  position: bottom_right        # top_left | top_right | bottom_left | bottom_right
  margin_x: 48
  margin_y: 420
  width_ratio: 0.25             # 相对画布宽度；上限 0.25（T3.2 夹取）
  opacity: 1.0

# 音频总线（T3.6）
audio:
  voice_gain_db: 0.0
  bgm_gain_db: -21.0
  duck_threshold: 0.05          # sidechaincompress 阈值
  duck_ratio: 8
  duck_attack_ms: 20
  duck_release_ms: 420
  target_lufs: -16.0            # 发布门禁 [-16.5, -15.5]
  true_peak_dbtp: -1.0
  tail_ms: 600                  # 成片时长 = ffprobe(voice_master) + tail_ms

# 字幕（Q11：开启 · T3.5）
# ★ 字幕同样是可选层：字体找不到 ⇒ 跳过字幕继续出片（与水印同一条口径）。
# font_name 必须与真实字体家族名一致，否则 libass 画出来是一排豆腐块。
# 想用自己的字体：把 .ttf/.otf 放进 templates/douyin_9x16_default/assets/fonts/
# 再把这个名字改成该字体的家族名（该目录优先于系统字体目录）。
subtitle:
  enabled: true
  font_name: Microsoft YaHei
  font_size: 64
  outline: 4
  shadow: 2
  margin_bottom: 420          # 实际 MarginV = max(这个值, safe_area.bottom)
  max_chars_per_line: 13      # 1080 宽 / 64px 字 ≈ 15 字，留点余量
  max_lines: 2
  safe_area:                  # 文字安全区（抖音底部交互区 ~420px）
    top: 220
    bottom: 420
    left: 60
    right: 60

# BGM（Q12：开启 · 可导入素材库）
bgm:
  enabled: true
  glob: data/assets/bgm/*.{mp3,m4a,wav,flac}
  avoid_recent_tasks: 5         # 近 5 个任务不重复（§04.2.4.4 维度 8）
  start_offset_max_ms: 15000