# ── 本地靶页（T5.2 · **不是平台**）────────────────────────────────────────
# 它存在的唯一理由：让 §06.5.3 那八步能在**没有账号、没有网络**的情况下被真跑一遍
# （真 Playwright、真 file://、真截图）。选择器热修时也可以拿它当靶子。
#
# ⚠️ 代号 ``fixture`` 不在 §06.2.1 的平台矩阵里，也**不在** publications.platform 的
#    CHECK 约束里 ⇒ 它永远不可能被落库成一条真实发布记录（见 platforms/fixture.py）。
platform: fixture
version: "2026-09-18"
# 这份**没有** ``calibrated`` / ``known_gaps``：那两个字段回答的是"这个平台的选择器
# 验过没有"，而靶页**不是平台**（它自己就是那个"真值"，没有改版这回事）。
# 面板上演练台那一行也不显示校准状态 —— 见 ``platform_options``。

urls:
  # 占位：真地址由 FixturePublisher 在装配期替换成 fixtures/upload_form.html 的 file:// URL。
  upload: "about:blank"
  manage: "about:blank"

selectors:
  login_ok: "#who"
  login_required: "#login-box"
  upload_input: "#video"
  title_input: "#title"
  caption_input: "#caption"
  upload_progress: "#progress"
  cover_trigger: "#cover-trigger"
  cover_input: "#cover"
  publish_button: "#publish"
  success_marker: "#result"
  reject_marker: "#reject"
  # 结果块里那个指向作品的链接（T5.9 真发布用）。`fetch_metrics` 从它的 `href`
  # 末段取作品号 —— 与真平台同一条代码路径（`_read_post_link`）。
  post_link: "#post-link"

  # ── 数据回收（T5.4 · §06.6）───────────────────────────────────────────
  # ⚠️ 与上面那批一样是**未实测初稿**。`metric_row` 里的 `{post_id}` 会被换成
  #    `publications.platform_post_id`；四个计数是**相对它**的后代选择器。
  #    真机校准时最常改的就是这四个 —— 平台的数字元素没有稳定的类名。
  metric_row: "[data-post-id=\"{post_id}\"]"
  metric_views: ".metric-views, span[data-metric=views]"
  metric_likes: ".metric-likes, span[data-metric=likes]"
  metric_comments: ".metric-comments, span[data-metric=comments]"
  metric_shares: ".metric-shares, span[data-metric=shares]"
  # 完播率：靶页给的是 ``42.3%`` 这种带百分号的写法（真平台上那个 % 常常
  # 在旁边的标签里，所以解析器两种都认，见 `parse_metric_ratio`）。
  metric_completion_rate: ".metric-completion_rate, span[data-metric=completion_rate]"

readback:
  title: value
  caption: text

markers:
  # ⚠️ **不含"扫码登录"**（陷阱 #212）：它是**登录页自己的按钮文案**，两种状态
  #    （从没登录过 / 登录过期）下都在页面上 —— 拿它当判据等于永远判成"过期"。
  #    靶页上这一条本来就不该出现（它没有二维码），顺手对齐成与三份真 pack 一样的写法：
  #    装配期的校验是**对所有 pack 一视同仁**的，靶页也不例外。
  login_expired_text: ["登录已过期", "请重新登录"]
  review_rejected_text: ["审核不通过", "内容违规", "未通过审核"]
