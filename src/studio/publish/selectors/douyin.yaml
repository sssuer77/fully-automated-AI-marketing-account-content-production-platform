# ── 抖音创作服务平台 · 选择器（T5.2 · §06.5.2「选择器集中化」· R13 可热修）─────────────
# ⚠️ **未实测初稿**：结构（要哪些键）可信，具体 CSS 值待**真机校准**（§06.2.2 把
#    "实测校准"写成了 T5.2 的现场动作，而它需要一个已登录的真实账号）。
#    改法见 docs/runbook/publish_selector.md —— 只改本文件，**不改代码**。
#    改完顺手把 version 改掉：它会被写进 publications.evidence_json，
#    事后靠它回答"这条是哪个版本的选择器发的"。
platform: douyin
version: "2026-09-18"

urls:
  upload: "https://creator.douyin.com/creator-micro/content/upload"
  manage: "https://creator.douyin.com/creator-micro/content/manage"

selectors:
  login_ok: "div.creator-header__user-info"
  login_required: "div.login-container, div.qrcode-login"
  upload_input: "input[type=file][accept*='video']"
  title_input: "input[placeholder*='标题']"
  caption_input: "div.editor-kit-container div[contenteditable=true], div[contenteditable=true]"
  upload_progress: "div.progress-bar, span.upload-percent"
  cover_trigger: "div.cover-upload, span:has-text('设置封面')"
  cover_input: "input[type=file][accept*='image']"
  publish_button: "button:has-text('发布')"
  success_marker: "div.success-page, text=发布成功"
  reject_marker: "div.audit-reject, text=审核不通过"

  # ── 数据回收（T5.4 · §06.6）───────────────────────────────────────────
  # ⚠️ 与上面那批一样是**未实测初稿**。`metric_row` 里的 `{post_id}` 会被换成
  #    `publications.platform_post_id`；四个计数是**相对它**的后代选择器。
  #    真机校准时最常改的就是这四个 —— 平台的数字元素没有稳定的类名。
  metric_row: "tr:has([data-id=\"{post_id}\"]), div[data-post-id=\"{post_id}\"]"
  metric_views: ".metric-views, span[data-metric=views]"
  metric_likes: ".metric-likes, span[data-metric=likes]"
  metric_comments: ".metric-comments, span[data-metric=comments]"
  metric_shares: ".metric-shares, span[data-metric=shares]"

readback:
  title: value
  caption: text

markers:
  login_expired_text: ["登录已过期", "请重新登录", "扫码登录"]
  review_rejected_text: ["审核不通过", "内容违规", "未通过审核"]
