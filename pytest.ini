[pytest]
testpaths = tests
pythonpath = src
asyncio_mode = auto
addopts = -ra --strict-markers --strict-config
markers =
    gpu: 需要 GPU（TTS 推理）
    slow: 慢用例（>10s）
    e2e: 端到端（跨阶段）
    contract: 契约测试（引用 § 条款编号）
    net: 需要外网（默认不跑）
filterwarnings =
    error::DeprecationWarning:studio.*
    ignore::DeprecationWarning:third_party.*