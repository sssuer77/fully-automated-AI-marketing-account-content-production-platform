[mypy]
python_version = 3.12
mypy_path = src
strict = True
warn_unreachable = True
disallow_untyped_defs = True
disallow_any_generics = True
no_implicit_optional = True
show_error_codes = True
pretty = True
exclude = (^web/|^\.venv|^tts/|^data/|^models/)

# 缺类型信息的可选依赖。
#
# **写法讲究**：mypy.ini 只认 `[mypy-<模块>]` 段；`[[mypy.overrides]]` 是 pyproject.toml 的写法，
# 写在 INI 里会被**静默忽略**（原先那段就是这么写的，一直没生效 —— 只因为那几个包恰好都装着，
# 所以谁也没发现）。下面逐段列出来。
#
# torch / soundfile / cosyvoice 只装在 tts/.venv（推理子环境），主 venv 里**没有**它们，
# 而 studio/tts/cosyvoice.py 的判据恰恰是「进得来吗」（没有 GPU 的机器也要能 import 这个模块）
# ⇒ 不建 stub、也不往主 venv 装。
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-jsonschema]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-ulid.*]
ignore_missing_imports = True

[mypy-psutil]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

[mypy-torch]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-soundfile]
ignore_missing_imports = True

[mypy-cosyvoice]
ignore_missing_imports = True

[mypy-cosyvoice.*]
ignore_missing_imports = True
