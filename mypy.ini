[mypy]
python_version = 3.12
mypy_path = src
strict = True
warn_unreachable = True
disallow_untyped_defs = True
disallow_any_generics = True
no_implicit_optional = True
show_error_codes = True
pretty = True
exclude = (^web/|^\.venv|^tts/|^data/|^models/)

[[mypy.overrides]]
module = ["yaml.*", "jsonschema", "jsonschema.*", "apscheduler.*", "playwright.*", "ulid.*", "psutil", "psutil.*"]
ignore_missing_imports = True